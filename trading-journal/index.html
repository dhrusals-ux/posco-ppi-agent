<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>매매일지 · Trading Journal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%93%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#0f1218; --bg-soft:#161b24; --panel:#1b212c; --panel-2:#222a37;
  --line:#2c3542; --line-soft:#232b37;
  --text:#e6ebf2; --muted:#8e9bb0; --faint:#5f6b7d;
  --accent:#4f8cff; --accent-soft:rgba(79,140,255,.15);
  --win:#22c55e; --win-soft:rgba(34,197,94,.16);
  --loss:#ef4444; --loss-soft:rgba(239,68,68,.16);
  --warn:#f59e0b;
  --radius:14px; --radius-sm:9px;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
}
html[data-theme="light"]{
  --bg:#f4f6fa; --bg-soft:#eceff5; --panel:#ffffff; --panel-2:#f7f9fc;
  --line:#dde3ec; --line-soft:#e8edf4;
  --text:#18202c; --muted:#5d6b7f; --faint:#8b97a8;
  --accent:#2563eb; --accent-soft:rgba(37,99,235,.10);
  --win:#15803d; --win-soft:rgba(21,128,61,.12);
  --loss:#dc2626; --loss-soft:rgba(220,38,38,.12);
  --shadow:0 8px 24px rgba(20,32,50,.10);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
  --bg:#f4f6fa; --bg-soft:#eceff5; --panel:#ffffff; --panel-2:#f7f9fc;
  --line:#dde3ec; --line-soft:#e8edf4;
  --text:#18202c; --muted:#5d6b7f; --faint:#8b97a8;
  --accent:#2563eb; --accent-soft:rgba(37,99,235,.10);
  --win:#15803d; --win-soft:rgba(21,128,61,.12);
  --loss:#dc2626; --loss-soft:rgba(220,38,38,.12);
  --shadow:0 8px 24px rgba(20,32,50,.10);
}
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:14px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- top bar ---------- */
.topbar{
  position:sticky; top:0; z-index:40;
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  padding:10px 18px; background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px); border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;letter-spacing:-.2px}
.brand small{color:var(--faint);font-weight:500;font-size:11px;letter-spacing:.4px}
.tabs{display:flex;gap:4px;background:var(--bg-soft);padding:4px;border-radius:11px;border:1px solid var(--line-soft)}
.tabs button{
  padding:6px 14px;border-radius:8px;color:var(--muted);font-weight:600;font-size:13px;
  transition:background .15s,color .15s;
}
.tabs button:hover{color:var(--text)}
.tabs button.on{background:var(--panel);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.spacer{flex:1}
.search{position:relative}
.search input{
  width:210px;padding:8px 12px 8px 32px;border-radius:10px;
  background:var(--bg-soft);border:1px solid var(--line);outline:none;
}
.search input:focus{border-color:var(--accent);background:var(--panel)}
.search::before{content:"🔍";position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:12px;opacity:.6}
.btn{
  padding:8px 14px;border-radius:10px;border:1px solid var(--line);
  background:var(--panel);font-weight:600;font-size:13px;transition:.15s;
}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08);color:#fff}
.btn.ghost{background:transparent}
.btn.danger:hover{border-color:var(--loss);color:var(--loss)}
.btn.icon{padding:8px 10px}

/* ---------- layout ---------- */
main{max-width:1180px;margin:0 auto;padding:18px 18px 80px}
.periodbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.periodbar h2{margin:0;font-size:20px;letter-spacing:-.4px;min-width:200px}
.periodbar .sub{color:var(--muted);font-size:12px}
.nav-btn{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font-size:15px}
.nav-btn:hover{border-color:var(--accent);color:var(--accent)}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:13px 15px}
.stat .k{color:var(--muted);font-size:11.5px;font-weight:600;letter-spacing:.2px;margin-bottom:4px}
.stat .v{font-size:20px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.stat .x{font-size:11.5px;color:var(--faint);margin-top:2px}
.pos{color:var(--win)} .neg{color:var(--loss)} .zero{color:var(--muted)}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.panel h3{margin:0 0 12px;font-size:14px;letter-spacing:-.2px}
.empty{padding:44px 20px;text-align:center;color:var(--faint);border:1px dashed var(--line);border-radius:var(--radius);background:var(--panel-2)}
.empty b{display:block;color:var(--muted);font-size:15px;margin-bottom:6px}

/* ---------- entry card ---------- */
.entry{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px;overflow:hidden}
.entry.win{border-left:3px solid var(--win)}
.entry.loss{border-left:3px solid var(--loss)}
.entry.flat{border-left:3px solid var(--line)}
.entry-head{display:flex;align-items:center;gap:10px;padding:12px 15px;flex-wrap:wrap}
.entry-head .sym{font-weight:700;font-size:15px;letter-spacing:-.2px}
.badge{padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;border:1px solid var(--line);color:var(--muted)}
.badge.long{background:var(--win-soft);color:var(--win);border-color:transparent}
.badge.short{background:var(--loss-soft);color:var(--loss);border-color:transparent}
.entry-head .pnl{margin-left:auto;font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;text-align:right}
.entry-head .pnl small{display:block;font-size:11px;font-weight:600;opacity:.85}
.entry-meta{display:flex;gap:14px;flex-wrap:wrap;padding:0 15px 10px;color:var(--muted);font-size:12px}
.entry-meta b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.tags{display:flex;gap:5px;flex-wrap:wrap;padding:0 15px 10px}
.tag{padding:2px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:600}
.stars{color:var(--warn);letter-spacing:1px;font-size:12px}
.comment{padding:0 15px 12px;white-space:pre-wrap;word-break:break-word;color:var(--text);font-size:13.5px}
.comment:empty{display:none}
.shots{display:flex;gap:8px;flex-wrap:wrap;padding:0 15px 12px}
.shots img{
  height:120px;max-width:230px;object-fit:cover;border-radius:var(--radius-sm);
  border:1px solid var(--line);cursor:zoom-in;background:var(--panel-2);transition:transform .12s
}
.shots img:hover{transform:scale(1.02);border-color:var(--accent)}
.entry-foot{display:flex;gap:6px;justify-content:flex-end;padding:0 12px 11px}
.entry-foot button{font-size:12px;padding:5px 10px;border-radius:8px;color:var(--muted);border:1px solid transparent}
.entry-foot button:hover{border-color:var(--line);color:var(--text)}
.entry-foot button.del:hover{color:var(--loss);border-color:var(--loss)}

/* ---------- week ---------- */
.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:18px}
.wday{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px;min-height:96px;cursor:pointer;transition:.15s}
.wday:hover{border-color:var(--accent)}
.wday.today{outline:2px solid var(--accent);outline-offset:-2px}
.wday .d{font-size:11px;color:var(--muted);font-weight:600;margin-bottom:6px;display:flex;justify-content:space-between}
.wday .p{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.4px}
.wday .c{font-size:11px;color:var(--faint);margin-top:4px}
.wday.sat .d{color:#6ea8ff} .wday.sun .d{color:#ff8b8b}

/* ---------- month ---------- */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .dow{text-align:center;font-size:11px;font-weight:700;color:var(--muted);padding-bottom:4px}
.cal .dow.sat{color:#6ea8ff} .cal .dow.sun{color:#ff8b8b}
.cell{
  min-height:84px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-sm);
  padding:7px 8px;cursor:pointer;transition:.15s;display:flex;flex-direction:column;gap:3px
}
.cell:hover{border-color:var(--accent)}
.cell.out{opacity:.35}
.cell.today{outline:2px solid var(--accent);outline-offset:-2px}
.cell .n{font-size:12px;font-weight:700;color:var(--muted)}
.cell .p{font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.cell .c{font-size:10.5px;color:var(--faint);margin-top:auto}
.cell.win{background:linear-gradient(180deg,var(--win-soft),transparent)}
.cell.loss{background:linear-gradient(180deg,var(--loss-soft),transparent)}
.cell .dot{width:5px;height:5px;border-radius:50%;background:var(--accent);display:inline-block;margin-left:3px}
.week-tot{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:6px}

/* ---------- stats ---------- */
.bars{display:flex;flex-direction:column;gap:7px}
.bar-row{display:grid;grid-template-columns:110px 1fr 96px;align-items:center;gap:10px;font-size:12.5px}
.bar-row .lbl{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{height:9px;border-radius:6px;background:var(--panel-2);position:relative;overflow:hidden}
.bar-fill{position:absolute;top:0;bottom:0;border-radius:6px}
.bar-row .val{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.chart{width:100%;height:190px;display:block}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.grid-2{grid-template-columns:1fr}}

/* ---------- modal ---------- */
dialog{
  border:none;padding:0;background:transparent;max-width:min(860px,94vw);width:100%;
}
dialog::backdrop{background:rgba(0,0,0,.6);backdrop-filter:blur(3px)}
.modal{
  background:var(--panel);border:1px solid var(--line);border-radius:18px;
  box-shadow:var(--shadow);max-height:92vh;display:flex;flex-direction:column;overflow:hidden
}
.modal-head{display:flex;align-items:center;gap:10px;padding:15px 20px;border-bottom:1px solid var(--line)}
.modal-head h3{margin:0;font-size:16px}
.modal-body{padding:18px 20px;overflow:auto}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;padding:13px 20px;border-top:1px solid var(--line);background:var(--panel-2)}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{
  width:100%;padding:9px 11px;border-radius:var(--radius-sm);
  background:var(--bg-soft);border:1px solid var(--line);outline:none;transition:.15s
}
html[data-theme="light"] .field input,html[data-theme="light"] .field select,html[data-theme="light"] .field textarea{background:var(--panel-2)}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);background:var(--panel)}
.field textarea{min-height:130px;resize:vertical;line-height:1.6}
.field .hint{font-size:11px;color:var(--faint);margin-top:4px}
.row{display:grid;gap:12px}
.row.c2{grid-template-columns:1fr 1fr}
.row.c3{grid-template-columns:1fr 1fr 1fr}
.row.c4{grid-template-columns:repeat(4,1fr)}
@media(max-width:640px){.row.c2,.row.c3,.row.c4{grid-template-columns:1fr 1fr}}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:9px;border-radius:var(--radius-sm);border:1px solid var(--line);background:var(--bg-soft);font-weight:600;font-size:13px;color:var(--muted)}
.seg button.on{border-color:transparent}
.seg button.on[data-v="long"]{background:var(--win-soft);color:var(--win)}
.seg button.on[data-v="short"]{background:var(--loss-soft);color:var(--loss)}
.rate{display:flex;gap:4px}
.rate button{font-size:19px;line-height:1;color:var(--faint);padding:2px}
.rate button.on{color:var(--warn)}
.drop{
  border:2px dashed var(--line);border-radius:var(--radius);padding:16px;text-align:center;
  color:var(--muted);font-size:13px;transition:.15s;cursor:pointer;background:var(--panel-2)
}
.drop:hover,.drop.over{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.drop b{display:block;font-size:13.5px;margin-bottom:3px;color:var(--text)}
.drop kbd{background:var(--bg-soft);border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-family:var(--mono);font-size:11px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.thumb{position:relative;width:112px;height:78px;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{
  position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;
  background:rgba(0,0,0,.65);color:#fff;font-size:12px;line-height:1;display:grid;place-items:center
}
.thumb button:hover{background:var(--loss)}
.autonote{font-size:11.5px;color:var(--accent);margin-top:4px;min-height:14px}

/* ---------- auth ---------- */
#auth{position:fixed;inset:0;z-index:80;background:var(--bg);display:none;place-items:center;padding:20px}
#auth.on{display:grid}
.auth-card{
  width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);
  border-radius:18px;box-shadow:var(--shadow);padding:28px 26px
}
.auth-card h1{margin:0 0 4px;font-size:22px;letter-spacing:-.5px}
.auth-card p{margin:0 0 20px;color:var(--muted);font-size:13px;line-height:1.6}
.auth-card .btn{width:100%;padding:11px;margin-top:8px}
.auth-err{color:var(--loss);font-size:12.5px;min-height:18px;margin:2px 0 4px}
.auth-alt{margin-top:16px;text-align:center}
.auth-alt button{color:var(--faint);font-size:12px;text-decoration:underline;text-underline-offset:3px}
.auth-alt button:hover{color:var(--muted)}

/* ---------- lightbox / toast / menu ---------- */
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;z-index:90;place-items:center;padding:24px;cursor:zoom-out}
#lightbox.on{display:grid}
#lightbox img{max-width:96vw;max-height:92vh;border-radius:10px}
#lightbox .lb-nav{position:absolute;top:50%;transform:translateY(-50%);font-size:38px;color:#fff;opacity:.55;padding:16px}
#lightbox .lb-nav:hover{opacity:1}
#lightbox .prev{left:6px} #lightbox .next{right:6px}
#toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);z-index:99;
  background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);
  padding:11px 18px;border-radius:11px;font-size:13px;font-weight:600;
  opacity:0;pointer-events:none;transition:.22s
}
#toast.on{opacity:1;transform:translate(-50%,0)}
.menu{
  position:absolute;right:18px;top:56px;z-index:50;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;box-shadow:var(--shadow);padding:6px;min-width:200px;display:none
}
.menu.on{display:block}
.menu button{display:block;width:100%;text-align:left;padding:9px 12px;border-radius:8px;font-size:13px}
.menu button:hover{background:var(--panel-2)}
.menu hr{border:none;border-top:1px solid var(--line);margin:5px 4px}
.fab{
  position:fixed;right:22px;bottom:22px;z-index:35;width:54px;height:54px;border-radius:50%;
  background:var(--accent);color:#fff;font-size:26px;box-shadow:0 8px 24px rgba(79,140,255,.4);display:none
}
@media(max-width:720px){
  .fab{display:grid;place-items:center}
  .search input{width:140px}
  .brand small{display:none}
  main{padding:14px 12px 90px}
  .week-grid{grid-template-columns:repeat(4,1fr)}
  .cell{min-height:66px}
}
</style>
</head>
<body>

<div id="auth">
  <form class="auth-card" id="auth-form" autocomplete="on">
    <h1>📓 매매일지</h1>
    <p>서버에 저장된 내 매매 기록에 로그인합니다.<br>어느 기기에서 접속해도 같은 일지가 보입니다.</p>
    <div class="field">
      <label for="a-user">아이디</label>
      <input id="a-user" name="username" autocomplete="username" autocapitalize="off" spellcheck="false" required>
    </div>
    <div class="field">
      <label for="a-pass">비밀번호</label>
      <input id="a-pass" name="password" type="password" autocomplete="current-password" required>
    </div>
    <div class="auth-err" id="auth-err"></div>
    <button class="btn primary" type="submit">로그인</button>
    <button class="btn" type="button" id="a-register" style="display:none">회원가입</button>
    <div class="auth-alt"><button type="button" id="a-local">서버 없이 이 브라우저에만 저장하며 쓰기</button></div>
  </form>
</div>

<header class="topbar">
  <div class="brand">📓 매매일지 <small>TRADING JOURNAL</small></div>
  <div class="tabs" id="tabs">
    <button data-view="day" class="on">일별</button>
    <button data-view="week">주별</button>
    <button data-view="month">월간</button>
    <button data-view="stats">통계</button>
  </div>
  <div class="spacer"></div>
  <div class="search"><input id="q" type="search" placeholder="종목 · 태그 · 코멘트 검색"></div>
  <button class="btn primary" id="btn-new">+ 새 일지</button>
  <button class="btn icon ghost" id="btn-menu" title="설정">⋯</button>
</header>

<div class="menu" id="menu">
  <div id="acct" style="padding:9px 12px;font-size:12px;color:var(--muted);line-height:1.5"></div>
  <button id="m-logout" style="display:none">🚪 로그아웃</button>
  <hr>
  <button id="m-theme">🌗 라이트/다크 전환</button>
  <hr>
  <button id="m-export">⬇️ 백업 내보내기 (JSON)</button>
  <button id="m-import">⬆️ 백업 불러오기</button>
  <button id="m-csv">📄 CSV 내보내기</button>
  <hr>
  <div id="embed-note" style="display:none;padding:8px 12px;font-size:11.5px;color:var(--warn);line-height:1.5">
    ⚠️ 미리보기(임베드) 화면에서는 파일 다운로드가 막힐 수 있어요. 백업은 페이지를 <b>새 탭에서 열고</b> 진행하세요.
  </div>
  <hr>
  <button id="m-sample">🧪 샘플 데이터 넣기</button>
  <button id="m-wipe" style="color:var(--loss)">🗑 전체 삭제</button>
</div>

<main>
  <div class="periodbar">
    <button class="nav-btn" id="prev">‹</button>
    <button class="nav-btn" id="next">›</button>
    <h2 id="period-label">—</h2>
    <span class="sub" id="period-sub"></span>
    <div class="spacer"></div>
    <button class="btn ghost" id="btn-today">오늘</button>
  </div>

  <div id="stats-cards" class="cards"></div>
  <div id="view"></div>
</main>

<button class="fab" id="fab">+</button>

<dialog id="modal">
  <form class="modal" method="dialog" id="form">
    <div class="modal-head">
      <h3 id="modal-title">새 매매일지</h3>
      <div class="spacer"></div>
      <button type="button" class="btn ghost icon" id="close-modal">✕</button>
    </div>
    <div class="modal-body">
      <div class="row c3">
        <div class="field">
          <label for="f-date">날짜 *</label>
          <input type="date" id="f-date" required>
        </div>
        <div class="field">
          <label for="f-time">시간</label>
          <input type="time" id="f-time">
        </div>
        <div class="field">

      </div>

        <label>차트 이미지</label>

          <b>📈 차트 이미지 붙여넣기 · 드래그 · 클릭 업로드</b>
          <span><kbd>Ctrl</kbd>+<kbd>V</kbd> 로 캡처 화면을 바로 붙여넣을 수 있어요 (여러 장 가능)</span>

</dialog>

<div id="lightbox">
  <button class="lb-nav prev" id="lb-prev">‹</button>
  <img id="lb-img" alt="차트 이미지">
  <button class="lb-nav next" id="lb-next">›</button>
</div>
<div id="toast"></div>
<input type="file" id="import-file" accept="application/json" hidden>

<script>
/* =========================================================
   매매일지 (Trading Journal) — 로컬 저장형 단일 파일 웹앱
   데이터는 브라우저(IndexedDB)에만 저장됩니다. 서버 전송 없음.
   ========================================================= */
(function(){
"use strict";

/* ---------------- utils ---------------- */
const $  = (s,r)=> (r||document).querySelector(s);
const $$ = (s,r)=> Array.from((r||document).querySelectorAll(s));
const pad = n => String(n).padStart(2,"0");
const ymd = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseYmd = s => { const p=String(s).split("-").map(Number); return new Date(p[0],p[1]-1,p[2]); };
const addDays = (d,n)=>{ const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const addMonths = (d,n)=>{ const x=new Date(d.getFullYear(),d.getMonth()+n,1); return x; };
const startOfWeek = d => { const x=new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; };
const isSameDay = (a,b)=> ymd(a)===ymd(b);
const uid = ()=> Date.now().toString(36)+Math.random().toString(36).slice(2,9);
const DOW = ["월","화","수","목","금","토","일"];
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => { const n=parseFloat(v); return isFinite(n)?n:null; };
const money = n => (n==null?"—":(n<0?"-":"")+Math.abs(Math.round(n)).toLocaleString("ko-KR"));
const signed = n => n==null?"—":(n>0?"+":"")+money(n);
const pct = n => n==null?"—":(n>0?"+":"")+(Math.round(n*100)/100).toLocaleString("ko-KR")+"%";
const cls = n => n==null||Math.abs(n)<1e-9?"zero":(n>0?"pos":"neg");
const weekNo = d => { const t=new Date(d.getFullYear(),d.getMonth(),d.getDate()); t.setDate(t.getDate()+3-((t.getDay()+6)%7));
  const first=new Date(t.getFullYear(),0,4); return 1+Math.round(((t-first)/864e5-3+((first.getDay()+6)%7))/7); };

function toast(msg){
  const el=$("#toast"); el.textContent=msg; el.classList.add("on");
  clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove("on"),2200);
}

/* ---------------- IndexedDB ---------------- */
const DB = {
  _db:null,
  open(){
    if(this._db) return Promise.resolve(this._db);
    return new Promise((res,rej)=>{
      const rq = indexedDB.open("trading-journal", 1);
      rq.onupgradeneeded = e => {
        const db = e.target.result;
        if(!db.objectStoreNames.contains("entries")) db.createObjectStore("entries",{keyPath:"id"});
        if(!db.objectStoreNames.contains("images"))  db.createObjectStore("images",{keyPath:"id"});
      };
      rq.onsuccess = e => { this._db=e.target.result; res(this._db); };
      rq.onerror   = e => rej(e.target.error);
    });
  },
  async _tx(store,mode,fn){
    const db = await this.open();
    return new Promise((res,rej)=>{
      const tx = db.transaction(store,mode);
      const rq = fn(tx.objectStore(store));
      tx.onerror = ()=>rej(tx.error);
      tx.oncomplete = ()=>res(rq && rq.result);
    });
  },
  all(s){   return this._tx(s,"readonly",  st=>st.getAll()); },
  get(s,k){ return this._tx(s,"readonly",  st=>st.get(k)); },
  put(s,v){ return this._tx(s,"readwrite", st=>st.put(v)); },
  del(s,k){ return this._tx(s,"readwrite", st=>st.delete(k)); },
  clear(s){ return this._tx(s,"readwrite", st=>st.clear()); }
};

/* ---------------- state ---------------- */
const state = {
  view:  localStorage.getItem("tj-view") || "day",
  cursor: new Date(),
  entries: [],
  imgCache: new Map(),   // id -> {thumb, blob}
  urlCache: new Map(),   // id -> objectURL
  query: "",
  editing: null,
  pending: [],           // 편집 중인 이미지 [{id,thumb,blob,isNew}]
  removed: []            // 편집 중 제거된 기존 이미지 id
};

function cmpEntry(a,b){
  if(a.date!==b.date) return a.date<b.date?-1:1;
  return (a.time||"")<(b.time||"")?-1:1;
}

/* ---------------- 저장소: 서버 모드 / 브라우저 모드 ---------------- */
const Session = { user:null, registrationOpen:false };

async function api(path, opts){
  const r = await fetch(path, Object.assign({credentials:"same-origin"}, opts||{}));
  if(r.status===401){ Session.user=null; showAuth(); throw new Error("로그인이 필요합니다"); }
  if(!r.ok){
    let msg = "요청에 실패했습니다 ("+r.status+")";
    try{ const j = await r.json(); if(j && typeof j.detail==="string") msg = j.detail; }catch(e){}
    throw new Error(msg);
  }
  return r.status===204 ? null : r.json();
}

/* 브라우저(IndexedDB) 저장 — 서버가 없을 때 */
const LocalStore = {
  mode:"local",
  async load(){
    const [entries, images] = await Promise.all([DB.all("entries"), DB.all("images")]);
    state.imgCache.clear();
    images.forEach(im => state.imgCache.set(im.id, im));
    return entries;
  },
  has(id){ return state.imgCache.has(id); },
  full(id){
    if(state.urlCache.has(id)) return state.urlCache.get(id);
    const im = state.imgCache.get(id);
    if(!im) return "";
    const url = URL.createObjectURL(im.blob);
    state.urlCache.set(id,url);
    return url;
  },
  thumb(id){ const im = state.imgCache.get(id); return im ? (im.thumb || this.full(id)) : ""; },
  pendingFor(entry){
    return (entry.images||[]).map(id=>state.imgCache.get(id)).filter(Boolean)
      .map(im=>({id:im.id, blob:im.blob, thumb:im.thumb, isNew:false}));
  },
  async saveEntry(e, pending, dropped){
    for(const p of (pending||[]).filter(p=>p.isNew)){
      await DB.put("images",{id:p.id, blob:p.blob, thumb:p.thumb, w:p.w, h:p.h});
      state.imgCache.set(p.id,{id:p.id, blob:p.blob, thumb:p.thumb});
    }
    for(const id of (dropped||[])){ await DB.del("images", id); state.imgCache.delete(id); }
    await DB.put("entries", e);
    return e;
  },
  async removeEntry(e){
    for(const id of (e.images||[])){ await DB.del("images", id); state.imgCache.delete(id); }
    await DB.del("entries", e.id);
  },
  async wipe(){ await DB.clear("entries"); await DB.clear("images"); },
  async exportBlob(){
    const images = [];
    for(const [id,im] of state.imgCache) images.push({id, thumb:im.thumb, data: await blobToDataURL(im.blob)});
    const payload = {app:"trading-journal", version:1, exportedAt:new Date().toISOString(), entries:state.entries, images};
    return new Blob([JSON.stringify(payload)],{type:"application/json"});
  },
  async importData(data){
    for(const im of (data.images||[])){
      const blob = im.data ? dataURLToBlob(im.data) : null;
      if(blob) await DB.put("images",{id:im.id, blob, thumb:im.thumb});
    }
    for(const e of (data.entries||[])) await DB.put("entries", e);
  }
};

/* 서버 저장 — 계정으로 로그인해 어느 기기에서나 같은 기록 */
const ServerStore = {
  mode:"server",
  async load(){ return api("/api/entries"); },
  has(){ return true; },
  full(id){ return "/api/images/"+encodeURIComponent(id); },
  thumb(id){ return "/api/images/"+encodeURIComponent(id)+"/thumb"; },
  pendingFor(entry){ return (entry.images||[]).map(id=>({id, thumb:this.thumb(id), isNew:false})); },
  async saveEntry(e, pending){
    const ids = [];
    for(const p of (pending||[])){
      if(!p.isNew){ ids.push(p.id); continue; }
      const fd = new FormData();
      fd.append("file", p.blob, "chart.jpg");
      if(p.thumb) fd.append("thumb", dataURLToBlob(p.thumb), "thumb.jpg");
      const up = await api("/api/images", {method:"POST", body:fd});
      ids.push(up.id);
    }
    e.images = ids;
    return api("/api/entries/"+encodeURIComponent(e.id),
      {method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(e)});
  },
  async removeEntry(e){ await api("/api/entries/"+encodeURIComponent(e.id), {method:"DELETE"}); },
  async wipe(){ await api("/api/entries", {method:"DELETE"}); },
  async exportBlob(){
    const r = await fetch("/api/export", {credentials:"same-origin"});
    if(!r.ok) throw new Error("백업을 만들지 못했습니다");
    return r.blob();
  },
  async importData(data){
    await api("/api/import", {method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({entries:data.entries||[], images:data.images||[]})});
  }
};

let Store = LocalStore;
async function loadAll(){ state.entries = (await Store.load()).sort(cmpEntry); }
const imgURL  = id => Store.full(id);
const thumbOf = id => Store.thumb(id);

/* ---------------- filtering / aggregation ---------------- */
function visible(){
  const q = state.query.trim().toLowerCase();
  if(!q) return state.entries;
  return state.entries.filter(e =>
    (e.symbol||"").toLowerCase().includes(q) ||
    (e.comment||"").toLowerCase().includes(q) ||
    (e.tags||[]).some(t=>t.toLowerCase().includes(q))
  );
}
function inRange(from,to){
  const a=ymd(from), b=ymd(to);
  return visible().filter(e => e.date>=a && e.date<=b);
}
function agg(list){
  const withPnl = list.filter(e => e.pnl!=null);
  const wins = withPnl.filter(e=>e.pnl>0), losses = withPnl.filter(e=>e.pnl<0);
  const sum = a => a.reduce((s,e)=>s+e.pnl,0);
  const gp = sum(wins), gl = Math.abs(sum(losses));
  return {
    n:list.length, scored:withPnl.length,
    pnl: withPnl.length?sum(withPnl):null,
    wins:wins.length, losses:losses.length,
    winRate: withPnl.length ? wins.length/withPnl.length*100 : null,
    avgWin: wins.length ? gp/wins.length : null,
    avgLoss: losses.length ? -gl/losses.length : null,
    pf: gl>0 ? gp/gl : (gp>0?Infinity:null),
    best: withPnl.length ? withPnl.reduce((m,e)=>e.pnl>m.pnl?e:m) : null,
    worst: withPnl.length ? withPnl.reduce((m,e)=>e.pnl<m.pnl?e:m) : null,
    avg: withPnl.length ? sum(withPnl)/withPnl.length : null
  };
}
function byDay(list){
  const m = new Map();
  list.forEach(e => { if(!m.has(e.date)) m.set(e.date,[]); m.get(e.date).push(e); });
  return m;
}
function dayPnl(list){
  const s = list.filter(e=>e.pnl!=null);
  return s.length ? s.reduce((a,e)=>a+e.pnl,0) : null;
}

/* ---------------- rendering: shell ---------------- */
function render(){
  $$("#tabs button").forEach(b=>b.classList.toggle("on", b.dataset.view===state.view));
  const v = state.view;
  const navHidden = (v==="stats") ? "none" : "";
  $("#prev").style.display = $("#next").style.display = $("#btn-today").style.display = navHidden;
  if(v==="day")   renderDay();
  else if(v==="week")  renderWeek();
  else if(v==="month") renderMonth();
  else renderStats();
}
function statCards(items){
  $("#stats-cards").innerHTML = items.map(i =>
    '<div class="stat"><div class="k">'+esc(i.k)+'</div>'+
    '<div class="v '+(i.c||"")+'">'+i.v+'</div>'+
    (i.x?'<div class="x">'+i.x+'</div>':'')+'</div>').join("");
}
function period(label, sub){ $("#period-label").textContent=label; $("#period-sub").textContent=sub||""; }
const emptyBox = (t,s)=> '<div class="empty"><b>'+t+'</b>'+(s||"")+'</div>';

/* ---------------- entry card ---------------- */
function entryCard(e){
  const k = e.pnl==null?"flat":(e.pnl>0?"win":(e.pnl<0?"loss":"flat"));
  const shots = (e.images||[]).filter(id=>Store.has(id));
  const price = [];
  if(e.entry!=null) price.push('진입 <b>'+e.entry.toLocaleString("ko-KR")+'</b>');
  if(e.exit!=null)  price.push('청산 <b>'+e.exit.toLocaleString("ko-KR")+'</b>');
  if(e.qty!=null)   price.push('수량 <b>'+e.qty.toLocaleString("ko-KR")+'</b>');
  if(e.fee)         price.push('비용 <b>'+money(e.fee)+'</b>');
  return ''+
  '<article class="entry '+k+'" data-id="'+e.id+'">'+
    '<div class="entry-head">'+
      '<span class="sym">'+esc(e.symbol||"(무제)")+'</span>'+
      '<span class="badge '+(e.side==="short"?"short":"long")+'">'+(e.side==="short"?"▼ 숏/매도":"▲ 롱/매수")+'</span>'+
      (e.rating?'<span class="stars">'+"★".repeat(e.rating)+'</span>':"")+
      '<span class="pnl '+cls(e.pnl)+'">'+signed(e.pnl)+
        (e.pnlPct!=null?'<small>'+pct(e.pnlPct)+'</small>':"")+'</span>'+
    '</div>'+
    '<div class="entry-meta">'+
      '<span>📅 '+e.date+' '+DOW[(parseYmd(e.date).getDay()+6)%7]+(e.time?' · '+e.time:"")+'</span>'+
      price.map(p=>'<span>'+p+'</span>').join("")+
      (shots.length?'<span>🖼 '+shots.length+'장</span>':"")+
    '</div>'+
    ((e.tags||[]).length?'<div class="tags">'+e.tags.map(t=>'<span class="tag">#'+esc(t)+'</span>').join("")+'</div>':"")+
    (e.comment?'<div class="comment">'+esc(e.comment)+'</div>':"")+
    (shots.length?'<div class="shots">'+shots.map((id,i)=>
        '<img loading="lazy" src="'+thumbOf(id)+'" data-entry="'+e.id+'" data-i="'+i+'" alt="차트">').join("")+'</div>':"")+
    '<div class="entry-foot">'+
      '<button class="edit" data-id="'+e.id+'">✏️ 수정</button>'+
      '<button class="dup" data-id="'+e.id+'">📄 복제</button>'+
      '<button class="del" data-id="'+e.id+'">🗑 삭제</button>'+
    '</div>'+
  '</article>';
}
function entryList(list){
  if(!list.length) return "";
  return list.slice().sort(cmpEntry).map(entryCard).join("");
}

/* ---------------- view: 일별 ---------------- */
function renderDay(){
  const d = state.cursor, key = ymd(d);
  const list = visible().filter(e=>e.date===key);
  const a = agg(list);
  period(d.getFullYear()+"년 "+(d.getMonth()+1)+"월 "+d.getDate()+"일",
         "("+DOW[(d.getDay()+6)%7]+") · "+weekNo(d)+"주차");
  statCards([
    {k:"거래 수", v:a.n+"건", x:a.scored+"건 손익 입력"},
    {k:"실현 손익", v:signed(a.pnl), c:cls(a.pnl)},
    {k:"승 / 패", v:a.wins+" / "+a.losses, x:a.winRate==null?"—":"승률 "+a.winRate.toFixed(0)+"%"},
    {k:"평균 손익", v:signed(a.avg), c:cls(a.avg)},
    {k:"최고 거래", v:a.best?signed(a.best.pnl):"—", c:a.best?cls(a.best.pnl):"", x:a.best?esc(a.best.symbol):""}
  ]);

  // 이번 주 스트립
  const ws = startOfWeek(d);
  const strip = Array.from({length:7},(_,i)=>{
    const dd = addDays(ws,i), k2 = ymd(dd);
    const dl = visible().filter(e=>e.date===k2), p = dayPnl(dl);
    const sel = k2===key ? " today":"";
    return '<div class="wday'+(i===5?" sat":"")+(i===6?" sun":"")+sel+'" data-date="'+k2+'">'+
      '<div class="d"><span>'+DOW[i]+'</span><span>'+dd.getDate()+'</span></div>'+
      '<div class="p '+cls(p)+'">'+(p==null?"·":signed(p))+'</div>'+
      '<div class="c">'+(dl.length?dl.length+"건":"")+'</div></div>';
  }).join("");

  $("#view").innerHTML =
    '<div class="week-grid" id="day-strip">'+strip+'</div>'+
    (list.length ? entryList(list)
      : emptyBox("이 날의 매매일지가 없습니다","‘+ 새 일지’ 버튼으로 오늘의 매매를 기록해 보세요."));
}

/* ---------------- view: 주별 ---------------- */
function renderWeek(){
  const ws = startOfWeek(state.cursor), we = addDays(ws,6);
  const list = inRange(ws,we), a = agg(list), map = byDay(list);
  period(weekNo(ws)+"주차", ymd(ws)+" ~ "+ymd(we));
  const tradingDays = Array.from(map.keys()).length;
  const dayPnls = Array.from(map.values()).map(dayPnl).filter(v=>v!=null);
  const upDays = dayPnls.filter(v=>v>0).length;
  statCards([
    {k:"주간 손익", v:signed(a.pnl), c:cls(a.pnl)},
    {k:"거래 수", v:a.n+"건", x:tradingDays+"일 매매"},
    {k:"승률", v:a.winRate==null?"—":a.winRate.toFixed(0)+"%", x:a.wins+"승 "+a.losses+"패"},
    {k:"수익 난 날", v:upDays+" / "+dayPnls.length},
    {k:"손익비 (PF)", v:a.pf==null?"—":(a.pf===Infinity?"∞":a.pf.toFixed(2))}
  ]);

  const cells = Array.from({length:7},(_,i)=>{
    const dd = addDays(ws,i), k = ymd(dd), dl = map.get(k)||[], p = dayPnl(dl);

/* ---------------- view: 월간 ---------------- */
function renderMonth(){
  const c = state.cursor, y=c.getFullYear(), m=c.getMonth();
  const first = new Date(y,m,1), last = new Date(y,m+1,0);
  const list = inRange(first,last), a = agg(list), map = byDay(list);
  period(y+"년 "+(m+1)+"월", list.length+"건 · "+Array.from(map.keys()).length+"일 매매");

  const dayPnls = Array.from(map.values()).map(dayPnl).filter(v=>v!=null);
  statCards([
    {k:"월간 손익", v:signed(a.pnl), c:cls(a.pnl)},
    {k:"거래 수", v:a.n+"건"},
    {k:"승률", v:a.winRate==null?"—":a.winRate.toFixed(0)+"%", x:a.wins+"승 "+a.losses+"패"},
    {k:"손익비 (PF)", v:a.pf==null?"—":(a.pf===Infinity?"∞":a.pf.toFixed(2)), x:"평균 "+signed(a.avg)},
    {k:"수익 난 날", v:dayPnls.filter(v=>v>0).length+" / "+dayPnls.length}
  ]);

  const gridStart = startOfWeek(first);
  let cells = DOW.map((d,i)=>'<div class="dow'+(i===5?" sat":"")+(i===6?" sun":"")+'">'+d+'</div>').join("");
  const weeks = [];
  for(let i=0;i<42;i++){
    const dd = addDays(gridStart,i);
    if(i>=35 && dd>last) break;
    const k = ymd(dd), dl = map.get(k)||[], p = dayPnl(dl);
    const out = dd.getMonth()!==m;
    const kind = p==null?"":(p>0?" win":(p<0?" loss":""));
    cells += '<div class="cell'+(out?" out":"")+kind+(isSameDay(dd,new Date())?" today":"")+'" data-date="'+k+'">'+
      '<div class="n">'+dd.getDate()+(dl.length?'<span class="dot"></span>':"")+'</div>'+
      (p!=null?'<div class="p '+cls(p)+'">'+signed(p)+'</div>':"")+
      (dl.length?'<div class="c">'+dl.length+'건</div>':"")+'</div>';
    if(i%7===6) weeks.push(addDays(gridStart,i-6));
  }

  const wrows = weeks.map(ws=>{
    const wl = inRange(ws,addDays(ws,6)), p = dayPnl(wl);
    const max = Math.max(1, ...weeks.map(w=>Math.abs(dayPnl(inRange(w,addDays(w,6)))||0)));
    const wpct = Math.min(100, Math.abs(p||0)/max*100);
    return '<div class="bar-row"><div class="lbl">'+weekNo(ws)+'주차 <span style="color:var(--faint)">'+
      (ws.getMonth()+1)+'/'+ws.getDate()+'</span></div>'+
      '<div class="bar-track"><div class="bar-fill" style="width:'+wpct+'%;background:'+
        ((p||0)>=0?"var(--win)":"var(--loss)")+'"></div></div>'+
      '<div class="val '+cls(p)+'">'+(p==null?"—":signed(p))+'</div></div>';
  }).join("");

  const daily = Array.from(map.keys()).sort().map(k=>{
    const dl = map.get(k), p = dayPnl(dl), dd = parseYmd(k);
    return '<div class="bar-row" data-date="'+k+'" style="cursor:pointer">'+
      '<div class="lbl">'+(dd.getMonth()+1)+'/'+dd.getDate()+' ('+DOW[(dd.getDay()+6)%7]+') · '+dl.length+'건</div>'+
      '<div class="bar-track"><div class="bar-fill" style="width:'+
        Math.min(100,Math.abs(p||0)/Math.max(1,...dayPnls.map(Math.abs))*100)+'%;background:'+
        ((p||0)>=0?"var(--win)":"var(--loss)")+'"></div></div>'+
      '<div class="val '+cls(p)+'">'+(p==null?"—":signed(p))+'</div></div>';
  }).join("");

  $("#view").innerHTML =
    '<div class="panel"><div class="cal" id="cal">'+cells+'</div></div>'+
    '<div class="grid-2">'+
      '<div class="panel"><h3>📅 주차별 손익</h3><div class="bars">'+(wrows||emptyBox("데이터 없음",""))+'</div></div>'+
      '<div class="panel"><h3>📈 일자별 손익 <span style="color:var(--faint);font-weight:400">(클릭 시 이동)</span></h3>'+
        '<div class="bars" id="daily-bars">'+(daily||emptyBox("데이터 없음",""))+'</div></div>'+
    '</div>'+
    (list.length? '<div class="panel"><h3>📝 이번 달 일지 '+list.length+'건</h3>'+entryList(list)+'</div>' : "");
}

/* ---------------- view: 통계 (전체 기간) ---------------- */
function renderStats(){
  const list = visible().slice().sort(cmpEntry);
  const a = agg(list);
  period("전체 통계", list.length?(list[0].date+" ~ "+list[list.length-1].date):"기록 없음");
  statCards([
    {k:"누적 손익", v:signed(a.pnl), c:cls(a.pnl)},
    {k:"총 거래", v:a.n+"건", x:Array.from(byDay(list).keys()).length+"일"},
    {k:"승률", v:a.winRate==null?"—":a.winRate.toFixed(1)+"%", x:a.wins+"승 "+a.losses+"패"},
    {k:"손익비 (PF)", v:a.pf==null?"—":(a.pf===Infinity?"∞":a.pf.toFixed(2))},
    {k:"평균 수익 / 손실", v:signed(a.avgWin)+" / "+signed(a.avgLoss)}
  ]);
  if(!list.length){ $("#view").innerHTML = emptyBox("아직 기록이 없습니다","일지를 쌓으면 누적 손익 곡선과 태그별 성과가 여기에 표시됩니다."); return; }

  // 누적 손익 곡선
  const dm = byDay(list), keys = Array.from(dm.keys()).sort();
  let cum = 0; const pts = keys.map(k=>{ cum += (dayPnl(dm.get(k))||0); return {k, v:cum}; });
  const vals = pts.map(p=>p.v), mx = Math.max(0,...vals), mn = Math.min(0,...vals);
  const W=760, H=180, P=8, span=(mx-mn)||1;
  const X = i => P + (pts.length<2?0:i*(W-P*2)/(pts.length-1));
  const Y = v => P + (mx-v)/span*(H-P*2);
  const line = pts.map((p,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(p.v).toFixed(1)).join(" ");
  const area = pts.length>1 ? line+" L "+X(pts.length-1).toFixed(1)+" "+Y(0).toFixed(1)+" L "+X(0).toFixed(1)+" "+Y(0).toFixed(1)+" Z" : "";
  const curveColor = cum>=0 ? "var(--win)" : "var(--loss)";
  const chart =
    '<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'+
      '<line x1="0" y1="'+Y(0)+'" x2="'+W+'" y2="'+Y(0)+'" stroke="var(--line)" stroke-dasharray="4 4"/>'+
      (area?'<path d="'+area+'" fill="'+curveColor+'" opacity=".13"/>':"")+
      '<path d="'+line+'" fill="none" stroke="'+curveColor+'" stroke-width="2" stroke-linejoin="round"/>'+
      (pts.length===1?'<circle cx="'+X(0)+'" cy="'+Y(pts[0].v)+'" r="3.5" fill="'+curveColor+'"/>':"")+
    '</svg>'+
    '<div style="display:flex;justify-content:space-between;color:var(--faint);font-size:11px;margin-top:4px">'+
      '<span>'+keys[0]+'</span><span>최고 '+signed(mx)+' · 최저 '+signed(mn)+'</span><span>'+keys[keys.length-1]+'</span></div>';

  const bars = (rows,fmt) => rows.length ? '<div class="bars">'+rows.map(r=>{
      const max = Math.max(1,...rows.map(x=>Math.abs(x.v||0)));
      return '<div class="bar-row"><div class="lbl">'+esc(r.label)+'</div>'+
        '<div class="bar-track"><div class="bar-fill" style="width:'+(Math.abs(r.v||0)/max*100)+'%;background:'+
        ((r.v||0)>=0?"var(--win)":"var(--loss)")+'"></div></div>'+
        '<div class="val '+cls(r.v)+'">'+(fmt?fmt(r):signed(r.v))+'</div></div>';
    }).join("")+'</div>' : emptyBox("데이터 없음","");

  // 월별
  const mm = new Map();
  list.forEach(e=>{ const k=e.date.slice(0,7); mm.set(k,(mm.get(k)||0)+(e.pnl||0)); });
  const monthly = Array.from(mm.keys()).sort().map(k=>({label:k, v:mm.get(k)}));

  // 요일별
  const wd = DOW.map(d=>({label:d+"요일", v:0, n:0}));
  list.forEach(e=>{ const i=(parseYmd(e.date).getDay()+6)%7; wd[i].v+=(e.pnl||0); wd[i].n++; });

  // 태그별
  const tg = new Map();
  list.forEach(e=>(e.tags||[]).forEach(t=>{
    const o = tg.get(t) || {label:"#"+t, v:0, n:0, w:0};
    o.v += (e.pnl||0); o.n++; if(e.pnl>0) o.w++; tg.set(t,o);
  }));
  const tags = Array.from(tg.values()).sort((x,y)=>y.v-x.v);

  // 종목별
  const sy = new Map();
  list.forEach(e=>{ const o = sy.get(e.symbol)||{label:e.symbol, v:0, n:0, w:0};
    o.v+=(e.pnl||0); o.n++; if(e.pnl>0) o.w++; sy.set(e.symbol,o); });
  const syms = Array.from(sy.values()).sort((x,y)=>y.v-x.v).slice(0,12);

  $("#view").innerHTML =
    '<div class="panel"><h3>💹 누적 손익 곡선</h3>'+chart+'</div>'+
    '<div class="grid-2">'+
      '<div class="panel"><h3>🗓 월별 성과</h3>'+bars(monthly)+'</div>'+
      '<div class="panel"><h3>📆 요일별 성과</h3>'+bars(wd, r=>(r.n?signed(r.v):'—')+' <span style="color:var(--faint);font-weight:400">'+r.n+'건</span>')+'</div>'+
      '<div class="panel"><h3>🏷 태그별 성과</h3>'+bars(tags, r=>signed(r.v)+' <span style="color:var(--faint);font-weight:400">'+r.w+'/'+r.n+'</span>')+'</div>'+
      '<div class="panel"><h3>📌 종목별 성과 (상위 12)</h3>'+bars(syms, r=>signed(r.v)+' <span style="color:var(--faint);font-weight:400">'+r.w+'/'+r.n+'</span>')+'</div>'+
    '</div>'+
    '<div class="panel"><h3>🏆 최고 / 최악 거래</h3>'+
      (a.best?entryCard(a.best):"")+(a.worst&&a.worst.id!==(a.best&&a.best.id)?entryCard(a.worst):"")+'</div>';
}

/* ---------------- images ---------------- */
function fileToImage(file){
  return new Promise((res,rej)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{ URL.revokeObjectURL(url); res(img); };
    img.onerror = e=>{ URL.revokeObjectURL(url); rej(e); };
    img.src = url;
  });
}
function canvasBlob(cv, type, q){
  return new Promise(res=>cv.toBlob(b=>res(b), type, q));
}
async function processImage(file){
  const img = await fileToImage(file);
  const MAX = 2000, TH = 400;
  const scale = Math.min(1, MAX/Math.max(img.width,img.height));
  let blob = file;
  if(scale < 1 || file.size > 900*1024){
    const cv = document.createElement("canvas");
    cv.width = Math.round(img.width*scale); cv.height = Math.round(img.height*scale);
    cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
    const out = await canvasBlob(cv,"image/jpeg",0.92);
    if(out && out.size < file.size) blob = out;
  }
  const ts = Math.min(1, TH/Math.max(img.width,img.height));
  const tc = document.createElement("canvas");
  tc.width = Math.round(img.width*ts); tc.height = Math.round(img.height*ts);
  tc.getContext("2d").drawImage(img,0,0,tc.width,tc.height);
  return { id:uid(), blob, thumb:tc.toDataURL("image/jpeg",0.72), w:img.width, h:img.height };
}
async function addFiles(files){
  const imgs = Array.from(files).filter(f=>f.type.startsWith("image/"));
  if(!imgs.length) return;
  for(const f of imgs){
    try{
      const rec = await processImage(f);
      rec.isNew = true;
      state.pending.push(rec);
    }catch(err){ console.error(err); toast("이미지를 읽지 못했습니다"); }
  }
  renderThumbs();
  toast(imgs.length+"장 추가됨");
}
function renderThumbs(){
  $("#thumbs").innerHTML = state.pending.map((p,i)=>
    '<div class="thumb"><img src="'+(p.thumb||URL.createObjectURL(p.blob))+'" alt="">'+
    '<button type="button" data-rm="'+i+'" title="제거">✕</button></div>').join("");
}

const modal = $("#modal");

function setSide(v){ sideVal=v; $$("#f-side button").forEach(b=>b.classList.toggle("on", b.dataset.v===v)); }
function setRating(v){ ratingVal=v; $$("#f-rating button").forEach(b=>{

function calcAuto(){
  const en=num($("#f-entry").value), ex=num($("#f-exit").value), qty=num($("#f-qty").value), fee=num($("#f-fee").value)||0;
  let p=null, r=null;
  if(en!=null && ex!=null){
    const dir = sideVal==="short" ? -1 : 1;
    r = (ex-en)/en*100*dir;
    if(qty!=null) p = (ex-en)*qty*dir - fee;
  }
  $("#pnl-note").textContent = p==null ? "" : "자동 계산: "+signed(p)+"원";
  $("#pct-note").textContent = r==null ? "" : "자동 계산: "+pct(r);
  if(autoPnl) $("#f-pnl").value = p==null ? "" : Math.round(p*100)/100;
  if(autoPct) $("#f-pnlpct").value = r==null ? "" : Math.round(r*100)/100;
}

function openModal(entry, presetDate){

  $("#f-exit").value    = entry && entry.exit!=null ? entry.exit : "";
  $("#f-qty").value     = entry && entry.qty!=null ? entry.qty : "";
  $("#f-fee").value     = entry && entry.fee!=null ? entry.fee : "";
  $("#f-pnl").value     = entry && entry.pnl!=null ? entry.pnl : "";

async function saveEntry(){
  const date = $("#f-date").value, symbol = $("#f-symbol").value.trim();
  if(!date){ toast("날짜를 입력하세요"); $("#f-date").focus(); return; }
  if(!symbol){ toast("종목을 입력하세요"); $("#f-symbol").focus(); return; }

  const prev = state.editing;
  const keptIds = state.pending.map(p=>p.id);
  const gone = prev ? (prev.images||[]).filter(id=>!keptIds.includes(id)) : [];

  const e = {
    id: prev ? prev.id : uid(),
    date, time: $("#f-time").value || "",
    symbol, side: sideVal,
    entry: num($("#f-entry").value), exit: num($("#f-exit").value),
    qty: num($("#f-qty").value), fee: num($("#f-fee").value),
    pnl: num($("#f-pnl").value), pnlPct: num($("#f-pnlpct").value),
    tags: $("#f-tags").value.split(",").map(s=>s.trim()).filter(Boolean),
    comment: $("#f-comment").value.trim(),
    rating: ratingVal,
    images: keptIds,
    createdAt: prev ? prev.createdAt : new Date().toISOString(),
    updatedAt: new Date().toISOString()
  };
  const btn = $("#btn-save");
  btn.disabled = true; btn.textContent = "저장 중…";
  try{
    const saved = (await Store.saveEntry(e, state.pending, gone)) || e;
    state.entries = state.entries.filter(x=>x.id!==saved.id).concat([saved]).sort(cmpEntry);
    closeModal();
    if(state.view==="day") state.cursor = parseYmd(date);
    render();
    toast(prev ? "수정되었습니다" : "일지가 저장되었습니다 ✅");
  }catch(err){
    console.error(err);
    toast("저장하지 못했습니다: "+err.message);
  }finally{
    btn.disabled = false; btn.textContent = "저장";
  }
}
async function deleteEntry(id){
  const e = state.entries.find(x=>x.id===id); if(!e) return;
  if(!confirm("‘"+(e.symbol||"")+"’ 일지를 삭제할까요? 되돌릴 수 없습니다.")) return;
  try{ await Store.removeEntry(e); }
  catch(err){ console.error(err); toast("삭제하지 못했습니다: "+err.message); return; }
  state.entries = state.entries.filter(x=>x.id!==id);
  if(modal.open) closeModal();
  render(); toast("삭제되었습니다");
}

/* ---------------- backup ---------------- */
function blobToDataURL(b){ return new Promise(res=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.readAsDataURL(b); }); }
function dataURLToBlob(u){
  const [head,b64] = u.split(",");
  const mime = (head.match(/:(.*?);/)||[,"image/jpeg"])[1];
  const bin = atob(b64), arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new Blob([arr],{type:mime});
}
async function hostDownloads(){
  try{
    if(window.claude && typeof window.claude.use==="function") return await window.claude.use("downloads");
  }catch(e){}
  return null;
}
async function download(name, blob){
  const dl = await hostDownloads();
  if(dl){                                   // claude.ai 아티팩트 등 임베드 환경
    try{
      await dl.save({filename:name, data:blob});
      toast("파일이 저장되었습니다 ✅");
    }catch(err){
      const code = err && err.code;
      if(code==="extension_not_enabled" && /\.csv$/.test(name)){
        try{
          await dl.save({filename:name.replace(/\.csv$/,".txt"), data:blob});
          toast("csv 저장이 막혀 .txt로 저장했습니다 (확장자만 .csv로 바꾸면 됩니다)");
        }catch(e2){ toast("저장하지 못했습니다: "+((e2&&e2.message)||"")); }
      }
      else if(code==="declined") toast("저장이 취소되었습니다");
      else if(code==="too_large") toast("파일이 너무 큽니다 (16MB 초과) — 이미지가 적은 기간만 나눠 백업하세요");
      else toast("저장하지 못했습니다: "+((err&&err.message)||""));
    }
    return;
  }
  const a = document.createElement("a");    // 일반 브라우저
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
  toast("파일이 저장되었습니다 ✅");
}

    const blob = await Store.exportBlob();
    await download("trading-journal-backup-"+ymd(new Date())+".json", blob);

async function importJSON(file){
  try{
    const data = JSON.parse(await file.text());
    if(!data.entries) throw new Error("형식 오류");
    if(!confirm("일지 "+data.entries.length+"건을 불러옵니다. 같은 ID는 덮어씁니다. 계속할까요?")) return;
    await Store.importData(data);
    await loadAll(); render(); toast("불러오기 완료 ✅");
  }catch(err){ console.error(err); toast("불러오기에 실패했습니다"); }
}
async function exportCSV(){
  const head = ["날짜","시간","종목","방향","진입가","청산가","수량","비용","손익","수익률(%)","평점","태그","코멘트"];
  const q = v => '"'+String(v==null?"":v).replace(/"/g,'""')+'"';
  const rows = state.entries.map(e=>[e.date,e.time,e.symbol,e.side==="short"?"숏":"롱",e.entry,e.exit,e.qty,e.fee,
    e.pnl,e.pnlPct,e.rating,(e.tags||[]).join(" "),(e.comment||"").replace(/\n/g," ")].map(q).join(","));
  await download("trading-journal-"+ymd(new Date())+".csv",
    new Blob(["﻿"+head.map(q).join(",")+"\n"+rows.join("\n")],{type:"text/csv;charset=utf-8"}));
}

/* ---------------- events ---------------- */
function shiftCursor(dir){
  if(state.view==="day")        state.cursor = addDays(state.cursor, dir);
  else if(state.view==="week")  state.cursor = addDays(state.cursor, dir*7);
  else if(state.view==="month") state.cursor = addMonths(state.cursor, dir);
  else return;
  render();
}
function gotoDate(k){ state.cursor = parseYmd(k); state.view="day"; localStorage.setItem("tj-view","day"); render(); window.scrollTo({top:0,behavior:"smooth"}); }

$("#tabs").addEventListener("click", e=>{
  const b = e.target.closest("button[data-view]"); if(!b) return;
  state.view = b.dataset.view; localStorage.setItem("tj-view", state.view); render();
});
$("#prev").onclick = ()=>shiftCursor(-1);
$("#next").onclick = ()=>shiftCursor(1);
$("#btn-today").onclick = ()=>{ state.cursor=new Date(); render(); };
$("#btn-new").onclick = ()=>openModal(null);
$("#fab").onclick = ()=>openModal(null);
$("#q").addEventListener("input", e=>{ state.query=e.target.value; render(); });

$("#view").addEventListener("click", e=>{
  const img = e.target.closest(".shots img");
  if(img){
    const en = state.entries.find(x=>x.id===img.dataset.entry);
    if(en) openLB((en.images||[]).filter(id=>Store.has(id)), +img.dataset.i);
    return;
  }
  const btn = e.target.closest(".entry-foot button");
  if(btn){
    const en = state.entries.find(x=>x.id===btn.dataset.id); if(!en) return;
    if(btn.classList.contains("edit")) openModal(en);
    else if(btn.classList.contains("del")) deleteEntry(en.id);
    else if(btn.classList.contains("dup")){
      const copy = Object.assign({}, en, {id:null, images:[]});
      openModal(null, ymd(state.cursor));
      $("#f-symbol").value=copy.symbol; $("#f-entry").value=copy.entry==null?"":copy.entry;
      $("#f-qty").value=copy.qty==null?"":copy.qty; $("#f-tags").value=(copy.tags||[]).join(", ");
      setSide(copy.side||"long");
      toast("복제본 — 저장하면 새 일지가 됩니다");
    }
    return;
  }
  const cell = e.target.closest("[data-date]");
  if(cell) gotoDate(cell.dataset.date);
});

/* 모달 폼 */
$("#f-side").addEventListener("click", e=>{
  const b = e.target.closest("button[data-v]"); if(!b) return; setSide(b.dataset.v); calcAuto();
});
$("#f-rating").addEventListener("click", e=>{

});
["f-entry","f-exit","f-qty","f-fee"].forEach(id=>$("#"+id).addEventListener("input", calcAuto));
$("#f-pnl").addEventListener("input", ()=>{ autoPnl=false; });
$("#f-pnlpct").addEventListener("input", ()=>{ autoPct=false; });
$("#btn-save").onclick = saveEntry;
$("#btn-cancel").onclick = closeModal;
$("#close-modal").onclick = closeModal;
$("#btn-delete").onclick = ()=>{ if(state.editing) deleteEntry(state.editing.id); };
$("#form").addEventListener("keydown", e=>{
  if((e.metaKey||e.ctrlKey) && e.key==="Enter"){ e.preventDefault(); saveEntry(); }
});
modal.addEventListener("cancel", e=>{ e.preventDefault(); closeModal(); });

/* 이미지 입력: 클릭 / 드래그 / 붙여넣기 */
$("#drop").onclick = ()=>$("#file").click();
$("#file").addEventListener("change", e=>{ addFiles(e.target.files); e.target.value=""; });
["dragenter","dragover"].forEach(ev=>$("#drop").addEventListener(ev, e=>{ e.preventDefault(); $("#drop").classList.add("over"); }));
["dragleave","drop"].forEach(ev=>$("#drop").addEventListener(ev, e=>{ e.preventDefault(); $("#drop").classList.remove("over"); }));

$("#thumbs").addEventListener("click", e=>{
  const b = e.target.closest("button[data-rm]"); if(!b) return;
  state.pending.splice(+b.dataset.rm,1); renderThumbs();
});
document.addEventListener("paste", e=>{
  if(!modal.open) return;
  const items = (e.clipboardData||{}).items || [];
  const files = Array.from(items).filter(i=>i.type.startsWith("image/")).map(i=>i.getAsFile()).filter(Boolean);
  if(files.length){ e.preventDefault(); addFiles(files); }
});

/* 라이트박스 */
$("#lightbox").addEventListener("click", e=>{
  if(e.target.id==="lb-prev"){ moveLB(-1); return; }
  if(e.target.id==="lb-next"){ moveLB(1); return; }
  if(e.target.tagName!=="IMG") $("#lightbox").classList.remove("on");

$("#lb-img").onclick = ()=>moveLB(1);

/* 메뉴 */
$("#btn-menu").onclick = e=>{ e.stopPropagation(); $("#menu").classList.toggle("on"); };
document.addEventListener("click", ()=>$("#menu").classList.remove("on"));
$("#menu").addEventListener("click", e=>e.stopPropagation());
$("#m-theme").onclick = ()=>{

  document.documentElement.dataset.theme = t; localStorage.setItem("tj-theme", t);
  $("#menu").classList.remove("on");

$("#m-export").onclick = ()=>{ $("#menu").classList.remove("on"); exportJSON(); };

$("#m-import").onclick = ()=>{ $("#menu").classList.remove("on"); $("#import-file").click(); };

$("#m-wipe").onclick = async ()=>{
  $("#menu").classList.remove("on");
  if(!confirm("모든 일지와 이미지를 삭제합니다. 되돌릴 수 없습니다. 계속할까요?")) return;
  if(!confirm("정말 전체 삭제할까요? 백업을 먼저 내보내는 것을 권장합니다.")) return;
  try{ await Store.wipe(); }catch(err){ toast("삭제하지 못했습니다: "+err.message); return; }
  await loadAll(); render(); toast("전체 삭제되었습니다");
};

/* 단축키 */
document.addEventListener("keydown", e=>{
  if(modal.open) return;
  const typing = /INPUT|TEXTAREA|SELECT/.test((e.target.tagName||""));
  if(e.key==="Escape"){ $("#lightbox").classList.remove("on"); return; }
  if($("#lightbox").classList.contains("on")){
    if(e.key==="ArrowLeft") moveLB(-1);
    if(e.key==="ArrowRight") moveLB(1);
    return;
  }
  if(typing) return;
  if(e.key==="n" || e.key==="N"){ e.preventDefault(); openModal(null); }
  else if(e.key==="ArrowLeft") shiftCursor(-1);
  else if(e.key==="ArrowRight") shiftCursor(1);
  else if(e.key==="t" || e.key==="T"){ state.cursor=new Date(); render(); }
  else if(["1","2","3","4"].includes(e.key)){
    state.view = ["day","week","month","stats"][+e.key-1];
    localStorage.setItem("tj-view", state.view); render();
  }
});

/* ---------------- 계정 / 로그인 ---------------- */
function showAuth(){ $("#auth").classList.add("on"); setTimeout(()=>$("#a-user").focus(),60); }
function hideAuth(){ $("#auth").classList.remove("on"); }
function authErr(msg){ $("#auth-err").textContent = msg || ""; }

function updateAccountUI(){
  if(Store.mode==="server" && Session.user){
    $("#acct").innerHTML = '☁️ 서버에 저장 중 · <b style="color:var(--text)">'+esc(Session.user)+'</b><br>'+
      '<span style="color:var(--faint)">어느 기기에서 접속해도 같은 기록이 보입니다</span>';
    $("#m-logout").style.display = "block";
  }else{
    $("#acct").innerHTML = '💾 이 브라우저에만 저장 중<br>'+
      '<span style="color:var(--faint)">다른 기기와 공유되지 않습니다 — 백업을 남겨두세요</span>';
    $("#m-logout").style.display = "none";
  }
}

async function startApp(){
  hideAuth();
  try{ await loadAll(); }
  catch(err){
    console.error(err);
    if(Store.mode==="local") toast("저장소를 열지 못했습니다 (시크릿 모드일 수 있어요)");
    else return;                       // 서버 모드에서 401 → 로그인 화면
  }
  updateAccountUI();
  render();
}

async function doAuth(kind){
  const username = $("#a-user").value.trim(), password = $("#a-pass").value;
  if(!username || !password){ authErr("아이디와 비밀번호를 모두 입력하세요"); return; }
  if(kind==="register" && password.length<6){ authErr("비밀번호는 6자 이상으로 정해주세요"); return; }
  authErr("");
  try{
    const r = await fetch("/api/auth/"+kind, {
      method:"POST", credentials:"same-origin",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({username, password})
    });
    if(!r.ok){
      let msg = kind==="login" ? "로그인하지 못했습니다" : "가입하지 못했습니다";
      try{ const j = await r.json(); if(j && typeof j.detail==="string") msg = j.detail; }catch(e){}
      authErr(msg); return;
    }
    const me = await r.json();
    Session.user = me.username;
    $("#a-pass").value = "";
    Store = ServerStore;
    await startApp();
    toast((kind==="register"?"가입 완료 — ":"")+"환영합니다, "+me.username+"님 ☁️");
  }catch(err){ console.error(err); authErr("서버에 연결할 수 없습니다"); }
}

$("#auth-form").addEventListener("submit", e=>{ e.preventDefault(); doAuth("login"); });
$("#a-register").onclick = ()=>doAuth("register");
$("#a-local").onclick = ()=>{
  Store = LocalStore;
  startApp();
  toast("이 브라우저에만 저장하는 모드로 시작합니다");
};
$("#m-logout").onclick = async ()=>{
  $("#menu").classList.remove("on");
  try{ await fetch("/api/auth/logout", {method:"POST", credentials:"same-origin"}); }catch(e){}
  Session.user = null; state.entries = [];
  render(); showAuth(); toast("로그아웃되었습니다");
};

/* ---------------- boot ---------------- */
(async function boot(){
  const t = localStorage.getItem("tj-theme"); if(t) document.documentElement.dataset.theme=t;
  let embedded = true;
  try{ embedded = (window.self!==window.top); }catch(e){}
  if(embedded) hostDownloads().then(dl=>{ if(!dl) $("#embed-note").style.display="block"; });

  let health = null;
  if(location.protocol==="http:" || location.protocol==="https:"){
    try{
      const r = await fetch("/api/health", {credentials:"same-origin"});
      if(r.ok) health = await r.json();
    }catch(e){ /* 정적 호스팅 — 브라우저 저장 모드 */ }
  }

  if(health && health.mode==="server"){
    Store = ServerStore;
    Session.registrationOpen = !!health.registrationOpen;
    if(Session.registrationOpen){
      $("#a-register").style.display = "block";
      $("#auth-form").querySelector("p").innerHTML =
        "이 서버의 <b>첫 계정</b>을 만들어 주세요.<br>이후 어느 기기에서 접속해도 같은 일지가 보입니다.";
    }
    try{
      const me = await api("/api/me");
      Session.user = me.username;
      await startApp();
    }catch(err){ showAuth(); }   // 미로그인 → 로그인 화면
  }else{
    Store = LocalStore;
    await startApp();
  }
})();
})();
</script>
